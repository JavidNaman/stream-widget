<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>یادمان جاویدنامان</title>
<link rel="icon" href="data:,">
<style>
/* Bundled so the widget never depends on a font CDN being reachable from OBS. */
@font-face {
    font-family: 'Vazirmatn';
    src: url('assets/vazirmatn-arabic.woff2') format('woff2');
    font-weight: 400 700;
    font-display: block;
    unicode-range: U+0600-06FF, U+0750-077F, U+0870-088E, U+0890-0891, U+0898-08E1,
        U+08E3-08FF, U+200C-200E, U+2010-2011, U+204F, U+2E41, U+FB50-FDFF, U+FE70-FE74,
        U+FE76-FEFC;
}
@font-face {
    font-family: 'Vazirmatn';
    src: url('assets/vazirmatn-latin.woff2') format('woff2');
    font-weight: 400 700;
    font-display: block;
    unicode-range: U+0000-00FF, U+2000-206F, U+2212, U+FEFF, U+FFFD;
}

:root {
    --scale: 1;
    --fade: 620ms;

    /* Sized from the data: the widest 99% of records need 392px of card. */
    --w: 410px;
    --h: 116px;
    --avatar: 76px;

    /* Apple's standard "smooth" curve — decelerates hard, never overshoots. */
    --ease: cubic-bezier(0.32, 0.72, 0, 1);

    /* The glass is painted rather than sampled, so it has to stay dark enough
       for white text to survive over a bright shot as well as a dark one. */
    --tint: 18, 20, 26;
    --tint-alpha: 0.62;

    /* Tuned against the worst case — a blown-out white shot behind the glass,
       where the panel only reaches a mid grey and white text has the least to
       work with. */
    --ink: #ffffff;
    --ink-dim: rgba(255, 255, 255, 0.86);
    --ink-faint: rgba(255, 255, 255, 0.68);
}

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: transparent;
}

body {
    font-family: 'Vazirmatn', 'Segoe UI', Tahoma, sans-serif;
    -webkit-font-smoothing: antialiased;
}

#stage {
    position: absolute;
    top: 0;
    right: 0;
    width: var(--w);
    height: var(--h);
    transform: scale(var(--scale));
    transform-origin: top right;
}

/* ---------------------------------------------------------------- the glass */

/* One glass container, never glass stacked on glass: the material is built from
   a translucent body, a lit top edge and a bright bottom lip, all painted. */
#card {
    position: absolute;
    inset: 0;
    border-radius: calc(var(--h) / 2);
    background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.20) 0%, rgba(255, 255, 255, 0.04) 38%,
            rgba(255, 255, 255, 0) 58%),
        radial-gradient(120% 160% at 78% -30%, rgba(255, 255, 255, 0.22), transparent 55%),
        radial-gradient(90% 130% at 10% 132%, rgba(255, 255, 255, 0.14), transparent 58%),
        rgba(var(--tint), var(--tint-alpha));
    /* Inset only — an outer drop shadow reads as muddy haze once it is composited
       over video. This is light gathering just inside the edge, not a shadow. */
    box-shadow:
        inset 0 4px 10px -6px rgba(255, 255, 255, 0.55),
        inset 0 -4px 10px -6px rgba(255, 255, 255, 0.3);
    opacity: 0;
    transition: opacity 900ms var(--ease);
}

/* The rim is what sells it as glass rather than tinted plastic: a hairline that
   is bright where the light hits and nearly gone where it doesn't, following the
   capsule all the way round. Drawn as a masked gradient border because a plain
   inset shadow can only be uniform. */
#card::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: 1px;
    background: linear-gradient(150deg,
        rgba(255, 255, 255, 0.9) 0%,
        rgba(255, 255, 255, 0.3) 18%,
        rgba(255, 255, 255, 0.08) 42%,
        rgba(255, 255, 255, 0.12) 58%,
        rgba(255, 255, 255, 0.45) 84%,
        rgba(255, 255, 255, 0.85) 100%);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    mask-composite: exclude;
    pointer-events: none;
}

#card.is-lit {
    opacity: 1;
}

/* Specular sweep. It fires once per person instead of looping forever, so the
   widget costs nothing between transitions. */
#sheen {
    position: absolute;
    inset: 0;
    border-radius: inherit;
    overflow: hidden;
    pointer-events: none;
}

#sheen::before {
    content: "";
    position: absolute;
    top: -50%;
    bottom: -50%;
    width: 38%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.38), transparent);
    transform: translateX(-180%) rotate(14deg);
    opacity: 0;
}

#stage.is-sweeping #sheen::before {
    animation: sweep 1500ms var(--ease);
}

@keyframes sweep {
    0% { transform: translateX(-180%) rotate(14deg); opacity: 0; }
    22% { opacity: 1; }
    100% { transform: translateX(360%) rotate(14deg); opacity: 0; }
}

/* ------------------------------------------------------------------ contents */

#content {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    gap: 16px;
    /* The right cap holds the portrait; the left one needs room for its curve. */
    padding-inline-start: 20px;
    padding-inline-end: 30px;
}

.avatar,
.info {
    /* opacity and transform only: both composite on the GPU, so OBS never has to
       repaint the layer mid-transition. */
    opacity: 0;
    will-change: opacity, transform;
    transition: opacity var(--fade) var(--ease), transform var(--fade) var(--ease);
}

.avatar {
    position: relative;
    flex: 0 0 auto;
    width: var(--avatar);
    height: var(--avatar);
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.08);
    transform: scale(0.92);
}

.avatar img {
    display: block;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
}

/* Same lit rim as the panel, so the portrait sits in the glass instead of on it. */
.avatar::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    padding: 1px;
    background: linear-gradient(150deg,
        rgba(255, 255, 255, 0.75) 0%,
        rgba(255, 255, 255, 0.18) 40%,
        rgba(255, 255, 255, 0.3) 70%,
        rgba(255, 255, 255, 0.65) 100%);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    mask-composite: exclude;
    pointer-events: none;
}

.info {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 3px;
    flex: 1 1 auto;
    min-width: 0;
    text-align: right;
    transform: translateY(14px);
}

/* Entered state. The portrait settles first and the text follows just behind it,
   which is what makes the change read as one motion rather than two. */
#stage.is-showing .avatar {
    opacity: 1;
    transform: scale(1);
}

#stage.is-showing .info {
    opacity: 1;
    transform: translateY(0);
    transition-delay: 70ms;
}

/* Leaving state: everything lifts and clears together. */
#stage.is-hiding .avatar {
    opacity: 0;
    transform: scale(0.96);
}

#stage.is-hiding .info {
    opacity: 0;
    transform: translateY(-12px);
}

.name {
    margin: 0;
    font-size: 19px;
    font-weight: 700;
    line-height: 1.25;
    color: var(--ink);
    letter-spacing: 0.1px;
    /* Two lines then ellipsis: a few source records have an entire eyewitness
       account typed into the name field. */
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
    line-clamp: 2;
    overflow: hidden;
    overflow-wrap: anywhere;
}

.meta,
.date {
    margin: 0;
    line-height: 1.35;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.meta {
    font-size: 15px;
    color: var(--ink-dim);
}

.date {
    font-size: 14px;
    color: var(--ink-faint);
}

.sep {
    opacity: 0.4;
    margin: 0 6px;
}

.is-empty {
    display: none;
}

/* --------------------------------------------------------------- adaptations */

@media (prefers-reduced-transparency: reduce) {
    :root {
        --tint-alpha: 0.94;
    }
}

@media (prefers-contrast: more) {
    :root {
        --tint-alpha: 0.9;
        --ink-dim: rgba(255, 255, 255, 0.92);
        --ink-faint: rgba(255, 255, 255, 0.75);
    }
}

@media (prefers-reduced-motion: reduce) {
    .avatar,
    .info {
        transition-duration: 120ms;
        transform: none !important;
    }

    #stage.is-sweeping #sheen::before {
        animation: none;
    }
}
</style>
</head>
<body>

<div id="stage">
    <div id="card"><div id="sheen"></div></div>
    <div id="content">
        <div class="avatar"><img id="photo" alt="" decoding="async"></div>
        <div class="info">
            <p id="name" class="name"></p>
            <p id="meta" class="meta"></p>
            <p id="date" class="date"></p>
        </div>
    </div>
</div>

<script>
'use strict';

const DATA_URL = 'data.json';
const PLACEHOLDER = 'images/_no-photo.webp';

const params = new URLSearchParams(location.search);

/** Reads a numeric URL parameter, falling back when absent or nonsense.
    Note the explicit null check — Number(null) is 0, not NaN, so without it a
    missing parameter would silently clamp to the minimum instead. */
function readNumber(name, fallback, min, max) {
    const raw = params.get(name);
    if (raw === null || raw.trim() === '') return fallback;
    const value = Number(raw);
    if (!Number.isFinite(value)) return fallback;
    return Math.min(Math.max(value, min), max);
}

const HOLD_MS = readNumber('duration', 6000, 1200, 120000);
const FADE_MS = readNumber('fade', 620, 0, 4000);
const SCALE = readNumber('scale', 1, 0.4, 4);
const SHUFFLE = params.get('order') !== 'list';

const root = document.documentElement;
root.style.setProperty('--fade', FADE_MS + 'ms');
root.style.setProperty('--scale', String(SCALE));

// How dense the glass is. The stylesheet default survives a blown-out white
// scene; over a consistently dark one it can go lower and let more of the shot
// through. Only written when asked for, so that leaving it alone keeps the
// reduced-transparency and high-contrast rules in charge.
if (params.has('glass')) {
    root.style.setProperty('--tint-alpha', String(readNumber('glass', 0.62, 0.25, 0.95)));
}

const elStage = document.getElementById('stage');
const elCard = document.getElementById('card');
const elPhoto = document.getElementById('photo');
const elName = document.getElementById('name');
const elMeta = document.getElementById('meta');
const elDate = document.getElementById('date');

let people = [];
let cursor = 0;

const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

/* --------------------------------------------------------------- data loading */

/** Fetches the roster, retrying forever so a source that starts before the
    network is up eventually recovers on its own instead of staying blank. */
async function loadPeople() {
    for (let attempt = 0; ; attempt++) {
        try {
            const res = await fetch(DATA_URL, { cache: 'no-cache' });
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const parsed = await res.json();
            if (!Array.isArray(parsed) || parsed.length === 0) throw new Error('empty roster');
            return parsed.filter((entry) => entry && typeof entry === 'object');
        } catch {
            await sleep(Math.min(1000 * 2 ** attempt, 30000));
        }
    }
}

/* -------------------------------------------------------------------- ordering */

function shuffle(list) {
    for (let i = list.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [list[i], list[j]] = [list[j], list[i]];
    }
    return list;
}

/** Walks the roster, reshuffling on each pass without ever repeating the person
    who was just on screen across the wrap. */
function nextPerson() {
    if (cursor >= people.length) {
        const last = people[people.length - 1];
        shuffle(people);
        if (people.length > 1 && people[0] === last) {
            [people[0], people[1]] = [people[1], people[0]];
        }
        cursor = 0;
    }
    return people[cursor++];
}

/* --------------------------------------------------------------------- render */

const imageFor = (person) => (person.photo ? 'images/' + person.id + '.jpg' : PLACEHOLDER);

/** Resolves to a portrait that is decoded and ready to paint — never rejects, so
    one dead image can't stall the loop or cause a half-drawn frame. */
async function resolveImage(src) {
    const image = new Image();
    image.src = src;
    try {
        await image.decode();
        return src;
    } catch {
        if (src === PLACEHOLDER) return src;
        return resolveImage(PLACEHOLDER);
    }
}

/** Sets text, hiding the element entirely when there is nothing to show. */
function setText(el, text) {
    const value = text == null ? '' : String(text).trim();
    el.textContent = value;
    el.classList.toggle('is-empty', value === '');
}

const FA_DIGITS = '۰۱۲۳۴۵۶۷۸۹';
const toPersianDigits = (value) => String(value).replace(/[0-9]/g, (d) => FA_DIGITS[Number(d)]);

function paint(person, src) {
    elPhoto.src = src;
    elPhoto.alt = person.name || '';

    setText(elName, person.name || 'ناشناس');

    // Age and place share a line; whichever is missing simply drops out, and if
    // both are missing the line disappears rather than leaving a gap.
    const bits = [];
    if (Number.isFinite(person.age)) bits.push(toPersianDigits(person.age) + ' ساله');
    if (person.place) bits.push(person.place);

    elMeta.replaceChildren();
    elMeta.classList.toggle('is-empty', bits.length === 0);
    bits.forEach((bit, index) => {
        if (index > 0) {
            const sep = document.createElement('span');
            sep.className = 'sep';
            sep.textContent = '·';
            elMeta.append(sep);
        }
        elMeta.append(document.createTextNode(bit));
    });

    setText(elDate, person.date);
}

/** Runs the light across the glass once, in step with the person changing. */
function sweep() {
    elStage.classList.remove('is-sweeping');
    void elStage.offsetWidth; // restart the animation
    elStage.classList.add('is-sweeping');
}

/* ----------------------------------------------------------------------- loop */

/** Resolves once the browser source is on screen again, so an inactive scene
    doesn't silently burn through the roster. */
function whenVisible() {
    if (!document.hidden) return Promise.resolve();
    return new Promise((resolve) => {
        document.addEventListener('visibilitychange', function onChange() {
            if (document.hidden) return;
            document.removeEventListener('visibilitychange', onChange);
            resolve();
        });
    });
}

async function run() {
    people = await loadPeople();
    if (SHUFFLE) shuffle(people);

    const first = nextPerson();
    const firstSrc = await resolveImage(imageFor(first));

    await document.fonts.ready; // reveal with the real font already applied
    paint(first, firstSrc);
    elCard.classList.add('is-lit');
    await sleep(180); // let the glass arrive before its contents do
    elStage.classList.add('is-showing');
    sweep();

    while (people.length > 1) {
        // Decode the next portrait while the current person is still on screen,
        // so the transition itself never waits on the network or the decoder.
        const upcoming = nextPerson();
        const upcomingSrc = await resolveImage(imageFor(upcoming));

        await sleep(HOLD_MS);
        await whenVisible();

        elStage.classList.remove('is-showing');
        elStage.classList.add('is-hiding');
        await sleep(FADE_MS);

        paint(upcoming, upcomingSrc);

        elStage.classList.remove('is-hiding');
        await sleep(20); // land on the entry pose before animating out of it
        elStage.classList.add('is-showing');
        sweep();

        await sleep(FADE_MS);
    }
}

run();
</script>
</body>
</html>
