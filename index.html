<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>یادمان جاویدنامان</title>
<link rel="icon" href="data:,">
<style>
/* Bundled so the widget never depends on a font CDN being reachable from OBS. */
@font-face {
    font-family: 'Vazirmatn';
    src: url('assets/vazirmatn-arabic.woff2') format('woff2');
    font-weight: 400 700;
    font-display: block;
    unicode-range: U+0600-06FF, U+0750-077F, U+0870-088E, U+0890-0891, U+0898-08E1,
        U+08E3-08FF, U+200C-200E, U+2010-2011, U+204F, U+2E41, U+FB50-FDFF, U+FE70-FE74,
        U+FE76-FEFC;
}
@font-face {
    font-family: 'Vazirmatn';
    src: url('assets/vazirmatn-latin.woff2') format('woff2');
    font-weight: 400 700;
    font-display: block;
    unicode-range: U+0000-00FF, U+2000-206F, U+2212, U+FEFF, U+FFFD;
}

:root {
    --scale: 1;
    --fade: 700ms;

    /* Sized from the data: the widest 99% of records need 392px, so 400 keeps
       the panel calm and fixed instead of resizing on every person. */
    --card-w: 400px;
    --card-h: 116px;
    --avatar: 76px;

    --surface: rgba(9, 11, 15, 0.86);
    --sheen: rgba(255, 255, 255, 0.06);
    --stroke: rgba(255, 255, 255, 0.2);
    --stroke-soft: rgba(255, 255, 255, 0.14);
    --ink: #f6f8fc;
    --ink-dim: #c3cbd8;
    --ink-faint: #949fb0;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: transparent;
    font-family: 'Vazirmatn', 'Segoe UI', Tahoma, sans-serif;
    -webkit-font-smoothing: antialiased;
}

/* Fixed box: every record renders at exactly the same size, so the overlay never
   shifts or resizes between people no matter how long a name or address is. */
#stage {
    position: relative;
    width: calc(var(--card-w) * var(--scale));
    height: calc(var(--card-h) * var(--scale));
    transform-origin: top right;
}

/* The frame fades in once and then stays put for the whole stream, so the
   overlay never blinks. Only its contents change from person to person. */
#card {
    position: absolute;
    inset: 0;
    width: var(--card-w);
    height: var(--card-h);
    transform: scale(var(--scale));
    transform-origin: top right;
    background: var(--surface);
    border: 1px solid var(--stroke);
    border-radius: 22px;
    backdrop-filter: blur(14px) saturate(125%);
    -webkit-backdrop-filter: blur(14px) saturate(125%);
    opacity: 0;
    transition: opacity var(--fade) ease-in-out;
}

#card::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background: linear-gradient(180deg, var(--sheen), rgba(255, 255, 255, 0));
    pointer-events: none;
}

/* Fading the contents out and back in — rather than crossfading two stacked
   cards — keeps the two people from being legible on top of each other. */
#content {
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    height: 100%;
    padding: 16px 18px;
    opacity: 0;
    transition: opacity var(--fade) ease-in-out;
    will-change: opacity;
}

.is-visible {
    opacity: 1 !important;
}

.avatar {
    position: relative;
    z-index: 1;
    flex: 0 0 auto;
    width: var(--avatar);
    height: var(--avatar);
    border-radius: 50%;
    overflow: hidden;
    border: 1px solid var(--stroke-soft);
    background: rgba(255, 255, 255, 0.05);
}

.avatar img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.info {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 3px;
    /* Centred, so a record with no age/place/date still sits balanced in the card
       instead of hugging the top. */
    flex: 1 1 auto;
    min-width: 0;
    text-align: right;
}

.name {
    margin: 0;
    font-size: 19px;
    font-weight: 700;
    line-height: 1.3;
    color: var(--ink);
    /* Two lines then ellipsis: a handful of source records have an entire
       eyewitness account typed into the name field. */
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
    line-clamp: 2;
    overflow: hidden;
    overflow-wrap: anywhere;
}

.meta,
.date {
    margin: 0;
    line-height: 1.35;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.meta {
    font-size: 15px;
    color: var(--ink-dim);
}

.date {
    font-size: 14px;
    color: var(--ink-faint);
}

.sep {
    opacity: 0.45;
    margin: 0 6px;
}

.is-empty {
    display: none;
}

@media (prefers-reduced-motion: reduce) {
    #card,
    #content {
        transition-duration: 1ms;
    }
}
</style>
</head>
<body>

<div id="stage">
    <article id="card">
        <div id="content">
            <div class="avatar"><img id="photo" alt="" decoding="async"></div>
            <div class="info">
                <p id="name" class="name"></p>
                <p id="meta" class="meta"></p>
                <p id="date" class="date"></p>
            </div>
        </div>
    </article>
</div>

<script>
'use strict';

const DATA_URL = 'data.json';
const PLACEHOLDER = 'images/_no-photo.webp';

const params = new URLSearchParams(location.search);

/** Reads a numeric URL parameter, falling back when absent or nonsense.
    Note the explicit null check — Number(null) is 0, not NaN, so without it a
    missing parameter would silently clamp to the minimum instead. */
function readNumber(name, fallback, min, max) {
    const raw = params.get(name);
    if (raw === null || raw.trim() === '') return fallback;
    const value = Number(raw);
    if (!Number.isFinite(value)) return fallback;
    return Math.min(Math.max(value, min), max);
}

const DISPLAY_MS = readNumber('duration', 6000, 1000, 120000);
const FADE_MS = readNumber('fade', 700, 0, 5000);
const SCALE = readNumber('scale', 1, 0.4, 4);
const SHUFFLE = params.get('order') !== 'list';

document.documentElement.style.setProperty('--fade', FADE_MS + 'ms');
document.documentElement.style.setProperty('--scale', String(SCALE));

const elCard = document.getElementById('card');
const elContent = document.getElementById('content');
const elPhoto = document.getElementById('photo');
const elName = document.getElementById('name');
const elMeta = document.getElementById('meta');
const elDate = document.getElementById('date');

let people = [];
let cursor = 0;

const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

/* --------------------------------------------------------------- data loading */

/** Fetches the roster, retrying forever so a source that starts before the
    network is up eventually recovers on its own instead of staying blank. */
async function loadPeople() {
    for (let attempt = 0; ; attempt++) {
        try {
            const res = await fetch(DATA_URL, { cache: 'no-cache' });
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const parsed = await res.json();
            if (!Array.isArray(parsed) || parsed.length === 0) throw new Error('empty roster');
            return parsed.filter((entry) => entry && typeof entry === 'object');
        } catch {
            await sleep(Math.min(1000 * 2 ** attempt, 30000));
        }
    }
}

/* -------------------------------------------------------------------- ordering */

function shuffle(list) {
    for (let i = list.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [list[i], list[j]] = [list[j], list[i]];
    }
    return list;
}

/** Walks the roster, reshuffling on each pass without ever repeating the
    person who was just on screen across the wrap. */
function nextPerson() {
    if (cursor >= people.length) {
        const last = people[people.length - 1];
        shuffle(people);
        if (people.length > 1 && people[0] === last) {
            [people[0], people[1]] = [people[1], people[0]];
        }
        cursor = 0;
    }
    return people[cursor++];
}

/* --------------------------------------------------------------------- render */

const imageFor = (person) => (person.photo ? 'images/' + person.id + '.jpg' : PLACEHOLDER);

/** Resolves to a usable src — never rejects, so one dead image can't stall the loop. */
function resolveImage(src) {
    return new Promise((resolve) => {
        const probe = new Image();
        probe.onload = () => resolve(src);
        probe.onerror = () => resolve(PLACEHOLDER);
        probe.src = src;
    });
}

/** Sets text, hiding the element entirely when there is nothing to show. */
function setText(el, text) {
    const value = text == null ? '' : String(text).trim();
    el.textContent = value;
    el.classList.toggle('is-empty', value === '');
}

const FA_DIGITS = '۰۱۲۳۴۵۶۷۸۹';
const toPersianDigits = (value) => String(value).replace(/[0-9]/g, (d) => FA_DIGITS[Number(d)]);

function paint(person, src) {
    elPhoto.src = src;
    elPhoto.alt = person.name || '';

    setText(elName, person.name || 'ناشناس');

    // Age and place share a line; whichever is missing simply drops out, and if
    // both are missing the line disappears rather than leaving a gap.
    const bits = [];
    if (Number.isFinite(person.age)) bits.push(toPersianDigits(person.age) + ' ساله');
    if (person.place) bits.push(person.place);

    elMeta.replaceChildren();
    elMeta.classList.toggle('is-empty', bits.length === 0);
    bits.forEach((bit, index) => {
        if (index > 0) {
            const sep = document.createElement('span');
            sep.className = 'sep';
            sep.textContent = '·';
            elMeta.append(sep);
        }
        elMeta.append(document.createTextNode(bit));
    });

    setText(elDate, person.date);
}

/* ----------------------------------------------------------------------- loop */

/** Resolves once the browser source is on screen again, so an inactive scene
    doesn't silently burn through the roster. */
function whenVisible() {
    if (!document.hidden) return Promise.resolve();
    return new Promise((resolve) => {
        document.addEventListener('visibilitychange', function onChange() {
            if (document.hidden) return;
            document.removeEventListener('visibilitychange', onChange);
            resolve();
        });
    });
}

async function run() {
    people = await loadPeople();
    if (SHUFFLE) shuffle(people);

    const first = nextPerson();
    const firstSrc = await resolveImage(imageFor(first));

    await document.fonts.ready; // reveal with the real font already applied
    paint(first, firstSrc);
    elCard.classList.add('is-visible');
    elContent.classList.add('is-visible');

    while (people.length > 1) {
        // Resolve the next portrait while the current person is still on screen,
        // so the transition itself never waits on the network.
        const upcoming = nextPerson();
        const upcomingSrc = await resolveImage(imageFor(upcoming));

        await sleep(DISPLAY_MS);
        await whenVisible();

        elContent.classList.remove('is-visible');
        await sleep(FADE_MS);

        paint(upcoming, upcomingSrc);
        elContent.classList.add('is-visible');
        await sleep(FADE_MS);
    }
}

run();
</script>
</body>
</html>
