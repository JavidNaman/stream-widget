<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>یادمان جاویدنامان</title>
<link rel="icon" href="data:,">
<style>
/* Bundled so the widget never depends on a font CDN being reachable from OBS. */
@font-face {
    font-family: 'Vazirmatn';
    src: url('assets/vazirmatn-arabic.woff2') format('woff2');
    font-weight: 400 700;
    font-display: block;
    unicode-range: U+0600-06FF, U+0750-077F, U+0870-088E, U+0890-0891, U+0898-08E1,
        U+08E3-08FF, U+200C-200E, U+2010-2011, U+204F, U+2E41, U+FB50-FDFF, U+FE70-FE74,
        U+FE76-FEFC;
}
@font-face {
    font-family: 'Vazirmatn';
    src: url('assets/vazirmatn-latin.woff2') format('woff2');
    font-weight: 400 700;
    font-display: block;
    unicode-range: U+0000-00FF, U+2000-206F, U+2212, U+FEFF, U+FFFD;
}

:root {
    --scale: 1;
    /* Details leave quickly and arrive gently, which shortens the moment the
       panel holds nothing and makes the change feel prompt rather than slow. */
    --fade: 380ms;
    --fade-out: 220ms;

    --h: 112px;
    --avatar: 76px;
    --max-w: 470px;

    /* Painted rather than sampled, so it has to stay dark enough for white text
       to survive over a blown-out shot as well as a dark one. */
    --tint: 18, 20, 26;
    --tint-alpha: 0.72;

    --ink: #ffffff;
    --ink-dim: rgba(255, 255, 255, 0.94);
    --ink-faint: rgba(255, 255, 255, 0.80);

    --blur: 6px;

    /* Content easing leads out and settles in. The panel resizes on a gentler,
       symmetric curve — a front-loaded one makes a large change snap. */
    --ease: cubic-bezier(0.4, 0, 0.2, 1);
    --ease-morph: cubic-bezier(0.45, 0.05, 0.2, 1);
    --morph: 520ms;
}

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: transparent;
}

body {
    font-family: 'Vazirmatn', 'Segoe UI', Tahoma, sans-serif;
    -webkit-font-smoothing: antialiased;
}

/* Shared by the card and the hidden ruler that measures the next person, so the
   two can never disagree about how wide a record wants to be. */
.box {
    display: flex;
    align-items: center;
    gap: 16px;
    height: var(--h);
    max-width: var(--max-w);
    /* The end side needs more room than the start: that is where the capsule
       curves away from the text. */
    padding-inline-start: 18px;
    padding-inline-end: 34px;
}

/* With no portrait, the text would otherwise sit right against the curve. */
.box.no-photo {
    padding-inline-start: 32px;
}

/* Anchored top-right so the card grows leftward as names get longer: the
   portrait stays exactly where the streamer put it. */
#card {
    position: absolute;
    top: 0;
    right: 0;
    width: max-content;
    border-radius: calc(var(--h) / 2);
    /* While the panel resizes, the outgoing details keep their own width and are
       wiped by the moving edge instead of being squeezed into an ellipsis. */
    overflow: hidden;
    transform: scale(var(--scale));
    transform-origin: top right;

    background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.20) 0%, rgba(255, 255, 255, 0.04) 38%,
            rgba(255, 255, 255, 0) 58%),
        radial-gradient(120% 160% at 78% -30%, rgba(255, 255, 255, 0.22), transparent 55%),
        radial-gradient(90% 130% at 10% 132%, rgba(255, 255, 255, 0.14), transparent 58%),
        rgba(var(--tint), var(--tint-alpha));
    box-shadow:
        inset 0 4px 10px -6px rgba(255, 255, 255, 0.55),
        inset 0 -4px 10px -6px rgba(255, 255, 255, 0.3);

    opacity: 0;
    /* The panel arrives once and then stays put for the whole stream. Afterwards
       only its width changes, morphing to fit whoever is next. */
    transition:
        opacity 600ms ease-in-out,
        width var(--morph) var(--ease-morph),
        padding-inline-start var(--morph) var(--ease-morph);
}

#card.is-lit {
    opacity: 1;
}

/* The rim is what reads as glass rather than tinted plastic: a hairline that is
   bright where the light would catch the capsule and nearly gone where it would
   not. Drawn as a masked gradient border, since an inset shadow is uniform. */
#card::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: 1px;
    background: linear-gradient(150deg,
        rgba(255, 255, 255, 0.9) 0%,
        rgba(255, 255, 255, 0.3) 18%,
        rgba(255, 255, 255, 0.08) 42%,
        rgba(255, 255, 255, 0.12) 58%,
        rgba(255, 255, 255, 0.45) 84%,
        rgba(255, 255, 255, 0.85) 100%);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    mask-composite: exclude;
    pointer-events: none;
}

/* Offscreen ruler: the next person is laid out here first, so the panel knows
   what width to morph to before anything visible changes. */
#measure {
    position: absolute;
    top: 0;
    right: 0;
    width: max-content;
    visibility: hidden;
    pointer-events: none;
}

/* Only the contents change from person to person: they fall out of focus and
   the next person resolves back into it. */
.avatar,
.info {
    opacity: 0;
    filter: blur(var(--blur));
    transition:
        opacity var(--fade-out) var(--ease),
        filter var(--fade-out) var(--ease);
    will-change: opacity, filter;
}

/* Duration declared on the destination state, so entering is slower than
   leaving without needing two sets of rules. */
#card.is-showing .avatar,
#card.is-showing .info {
    opacity: 1;
    filter: blur(0px);
    transform: none;
    transition-duration: var(--fade);
}

/* ---- alternative changeovers, chosen with ?anim= ---- */

/* Plain fade: no focus pull. */
#card[data-anim="fade"] .avatar,
#card[data-anim="fade"] .info {
    filter: none;
}

/* The details rise into place instead of resolving. */
#card[data-anim="slide"] .avatar,
#card[data-anim="slide"] .info {
    filter: none;
    transform: translateY(13px);
    transition-property: opacity, transform;
}

/* A hard cut, for anyone who wants no motion at all. */
#card[data-anim="none"] .avatar,
#card[data-anim="none"] .info {
    filter: none;
    transition: none;
}

/* Subtitle style: the panel itself closes and opens across, and the contents
   are wiped by its edge rather than faded. */
#card[data-anim="wipe"] .avatar,
#card[data-anim="wipe"] .info {
    filter: none;
    opacity: 1;
    transition: none;
}

.avatar {
    position: relative;
    flex: 0 0 auto;
    width: var(--avatar);
    height: var(--avatar);
    border-radius: 50%;
}

/* People with no portrait simply have no portrait: the card closes up around
   the text instead of showing a stand-in. */
.avatar.is-empty {
    display: none;
}

.avatar img {
    display: block;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
}

.avatar::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    padding: 1px;
    background: linear-gradient(150deg,
        rgba(255, 255, 255, 0.75) 0%,
        rgba(255, 255, 255, 0.18) 40%,
        rgba(255, 255, 255, 0.3) 70%,
        rgba(255, 255, 255, 0.65) 100%);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    mask-composite: exclude;
    pointer-events: none;
}

/* Width is written by JS from the ruler, so the lines never resize with the
   panel and so can never be clipped by it mid-animation. */
.info {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 2px;
    flex: 0 0 auto;
    min-width: 0;
    text-align: right;
}

.name,
.meta,
.date {
    margin: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.name {
    font-size: var(--name-size, 22px);
    font-weight: 700;
    line-height: 1.3;
    color: var(--ink);
}

/* A label in front of the name, not part of it: sized in em so it shrinks with
   the name, and held back in weight and colour so the name still reads first. */
.honorific {
    font-size: 0.6em;
    font-weight: 400;
    color: rgba(255, 255, 255, 0.62);
    /* A literal space sits between this and the name in the markup — it is what
       stops the shaper joining the م here to the first letter of the name — and
       this margin only widens the gap it already makes. */
    margin-inline-end: 3px;
}

.meta {
    font-size: 17px;
    line-height: 1.35;
    color: var(--ink-dim);
}

.date {
    font-size: 15px;
    line-height: 1.35;
    color: var(--ink-faint);
}

.sep {
    opacity: 0.4;
    margin: 0 7px;
}

.is-empty {
    display: none;
}


/* ------------------------------------------------------------------ themes */

/* Light: a solid white card for streams shot against dark scenes, where a dark
   panel disappears and a bright one reads instantly. */
#card[data-theme="light"] {
    --ink: #14181f;
    --ink-dim: rgba(20, 24, 31, 0.82);
    --ink-faint: rgba(20, 24, 31, 0.6);
    background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.9) 0%, rgba(255, 255, 255, 0.55) 60%,
            rgba(255, 255, 255, 0.35) 100%),
        rgba(252, 253, 255, 0.94);
    box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.9),
        inset 0 -1px 0 rgba(20, 24, 31, 0.08);
}

#card[data-theme="light"]::after {
    background: linear-gradient(150deg,
        rgba(20, 24, 31, 0.22) 0%,
        rgba(20, 24, 31, 0.08) 40%,
        rgba(20, 24, 31, 0.06) 62%,
        rgba(20, 24, 31, 0.18) 100%);
}

#card[data-theme="light"] .honorific {
    color: rgba(20, 24, 31, 0.5);
}

#card[data-theme="light"] .avatar::after {
    background: linear-gradient(150deg,
        rgba(20, 24, 31, 0.28) 0%,
        rgba(20, 24, 31, 0.1) 50%,
        rgba(20, 24, 31, 0.22) 100%);
}

/* Subtitle: a flat, fully opaque bar meant to sit under the picture rather than
   float over it. No translucency at all, so nothing behind it shows through. */
.box[data-theme="subtitle"] {
    --h: 96px;
    padding-inline-start: 26px;
}

.box[data-theme="subtitle"].no-photo {
    padding-inline-start: 34px;
}

#card[data-theme="subtitle"] {
    border-radius: 8px;
    /* Room for the accent edge behind the portrait. */
    padding-inline-start: 26px;
    background: #0d1015;
    box-shadow: none;
}

#card[data-theme="subtitle"]::after {
    /* One accent edge instead of a lit rim — there is no glass to imply here. */
    padding: 0;
    background: none;
    border-inline-start: 3px solid #b3282d;
    -webkit-mask: none;
    mask: none;
}

#card[data-theme="subtitle"].no-photo {
    padding-inline-start: 34px;
}

#card[data-theme="subtitle"] .avatar {
    border-radius: 6px;
}

#card[data-theme="subtitle"] .avatar img {
    border-radius: 6px;
}

#card[data-theme="subtitle"] .avatar::after {
    border-radius: 6px;
    background: linear-gradient(150deg, rgba(255, 255, 255, 0.3), rgba(255, 255, 255, 0.1));
}

@media (prefers-reduced-transparency: reduce) {
    :root {
        --tint-alpha: 0.96;
    }
}

@media (prefers-contrast: more) {
    :root {
        --tint-alpha: 0.9;
        --ink-dim: rgba(255, 255, 255, 0.92);
        --ink-faint: rgba(255, 255, 255, 0.75);
    }
}

@media (prefers-reduced-motion: reduce) {
    :root {
        --blur: 0px;
    }

    #card,
    .avatar,
    .info {
        transition-duration: 120ms;
    }
}
</style>
</head>
<body>

<div id="card" class="box">
    <div class="avatar"><img alt="" decoding="async"></div>
    <div class="info">
        <p class="name"><span class="honorific">جاویدنام</span> <span class="given"></span></p>
        <p class="meta"></p>
        <p class="date"></p>
    </div>
</div>

<div id="measure" class="box" aria-hidden="true">
    <div class="avatar"></div>
    <div class="info">
        <p class="name"><span class="honorific">جاویدنام</span> <span class="given"></span></p>
        <p class="meta"></p>
        <p class="date"></p>
    </div>
</div>

<script>
'use strict';

const DATA_URL = 'data.json';

const params = new URLSearchParams(location.search);

/** Reads a numeric URL parameter, falling back when absent or nonsense.
    Note the explicit null check — Number(null) is 0, not NaN, so without it a
    missing parameter would silently clamp to the minimum instead. */
function readNumber(name, fallback, min, max) {
    const raw = params.get(name);
    if (raw === null || raw.trim() === '') return fallback;
    const value = Number(raw);
    if (!Number.isFinite(value)) return fallback;
    return Math.min(Math.max(value, min), max);
}

const root = document.documentElement;

/** Reads a length declared in the stylesheet, so a value the CSS owns is never
    also hard-coded here where the two could drift apart. */
function cssPixels(name, fallback) {
    const value = parseFloat(getComputedStyle(root).getPropertyValue(name));
    return Number.isFinite(value) ? value : fallback;
}

const DEFAULT_FADE = cssPixels('--fade', 520);
const DEFAULT_GLASS = parseFloat(getComputedStyle(root).getPropertyValue('--tint-alpha')) || 0.62;
const MAX_W = cssPixels('--max-w', 470);
const NAME_SIZE = parseFloat(getComputedStyle(document.querySelector('#card .name')).fontSize) || 22;

const HOLD_MS = readNumber('duration', 6000, 1200, 120000);
const FADE_MS = readNumber('fade', DEFAULT_FADE, 0, 4000);
const SCALE = readNumber('scale', 1, 0.4, 4);
const SHUFFLE = params.get('order') !== 'list';

const ANIMATIONS = ['blur', 'fade', 'slide', 'wipe', 'none'];
const ANIM = ANIMATIONS.includes(params.get('anim')) ? params.get('anim') : 'blur';

const THEMES = ['glass', 'light', 'subtitle'];
const THEME = THEMES.includes(params.get('theme')) ? params.get('theme') : 'glass';
// The subtitle bar is a caption, so it wipes open and shut unless told otherwise.
const MOTION = params.has('anim') ? ANIM : (THEME === 'subtitle' ? 'wipe' : ANIM);


const FADE_OUT_MS = Math.round(FADE_MS * 0.58);
root.style.setProperty('--fade', FADE_MS + 'ms');
root.style.setProperty('--fade-out', FADE_OUT_MS + 'ms');
for (const box of document.querySelectorAll('.box')) {
    box.dataset.theme = THEME;
    box.dataset.anim = MOTION;
}
root.style.setProperty('--scale', String(SCALE));

// Only written when asked for, so leaving it alone keeps the reduced-transparency
// and high-contrast rules in charge of how dense the glass is.
if (params.has('glass')) {
    root.style.setProperty('--tint-alpha', String(readNumber('glass', DEFAULT_GLASS, 0.25, 0.95)));
}

const elCard = document.getElementById('card');
const elMeasure = document.getElementById('measure');
const elInfo = elCard.querySelector('.info');

let people = [];
let cursor = 0;

const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

/** Fetches the roster, retrying so a source that starts before the network is up
    recovers on its own instead of staying blank. */
async function loadPeople() {
    for (let attempt = 0; ; attempt++) {
        try {
            const res = await fetch(DATA_URL, { cache: 'no-cache' });
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const parsed = await res.json();
            if (!Array.isArray(parsed) || parsed.length === 0) throw new Error('empty roster');
            return parsed.filter((entry) => entry && typeof entry === 'object');
        } catch {
            await sleep(Math.min(1000 * 2 ** attempt, 30000));
        }
    }
}

function shuffle(list) {
    for (let i = list.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [list[i], list[j]] = [list[j], list[i]];
    }
    return list;
}

/** Walks the roster, reshuffling on each pass without repeating the person who
    was just on screen across the wrap. */
function nextPerson() {
    if (cursor >= people.length) {
        const last = people[people.length - 1];
        shuffle(people);
        if (people.length > 1 && people[0] === last) {
            [people[0], people[1]] = [people[1], people[0]];
        }
        cursor = 0;
    }
    return people[cursor++];
}

/** Warms the cache for a portrait and reports whether it is usable at all.
    Decoding a detached Image only gets the bytes in; the element on screen still
    has to load and decode them itself, which is what showPortrait waits for. */
async function prefetchImage(person) {
    if (!person.photo) return null;
    const src = 'images/' + person.id + '.jpg';
    const probe = new Image();
    probe.src = src;
    try {
        await probe.decode();
        return src;
    } catch {
        return null;
    }
}

/** Points the on-screen portrait at `src` and resolves only once that element is
    ready to paint it. Without this the card can spend a frame or two still
    showing the previous person's photo beside the new person's name. */
async function showPortrait(src) {
    const image = elCard.querySelector('img');
    if (!src) {
        image.removeAttribute('src');
        return false;
    }
    image.src = src;
    try {
        await image.decode();
        return true;
    } catch {
        image.removeAttribute('src');
        return false;
    }
}

/** Sets text, hiding the element entirely when there is nothing to show. */
function setText(el, text) {
    const value = text == null ? '' : String(text).trim();
    el.textContent = value;
    el.classList.toggle('is-empty', value === '');
}

const FA_DIGITS = '۰۱۲۳۴۵۶۷۸۹';
const toPersianDigits = (value) => String(value).replace(/[0-9]/g, (d) => FA_DIGITS[Number(d)]);

/** Lays a person out inside `box` — either the visible card or the ruler. */
function paint(box, person, src, nameSize) {
    const avatar = box.querySelector('.avatar');
    const image = avatar.querySelector('img');

    avatar.classList.toggle('is-empty', !src);
    box.classList.toggle('no-photo', !src);
    // The pixels are swapped by showPortrait, which can wait for the decode.
    if (image) image.alt = src ? (person.name || '') : '';

    // Only the given name is written; the honorific in front of it is markup and
    // stays where it is.
    box.querySelector('.given').textContent = person.name || 'ناشناس';

    // Age and place share a line; whichever is missing drops out, and if both are
    // missing the line disappears rather than leaving a gap.
    const bits = [];
    if (Number.isFinite(person.age)) bits.push(toPersianDigits(person.age) + ' ساله');
    if (person.place) bits.push(person.place);

    const meta = box.querySelector('.meta');
    meta.replaceChildren();
    meta.classList.toggle('is-empty', bits.length === 0);
    bits.forEach((bit, index) => {
        if (index > 0) {
            const sep = document.createElement('span');
            sep.className = 'sep';
            sep.textContent = '·';
            meta.append(sep);
        }
        meta.append(document.createTextNode(bit));
    });

    setText(box.querySelector('.date'), person.date);

    if (nameSize) box.style.setProperty('--name-size', nameSize);
    else box.style.removeProperty('--name-size');
}

/** Nobody's name gets cut short. The handful too long for the panel step down a
    point or two instead of ending in an ellipsis.

    This is measured on the ruler and never on the card, because the card's width
    is often mid-animation — measuring against it sized the very first name
    against an empty 52px panel and cropped it. */
function fitName(box) {
    const name = box.querySelector('.name');
    box.style.removeProperty('--name-size');
    if (name.scrollWidth <= name.clientWidth + 1) return null;
    const ratio = name.clientWidth / name.scrollWidth;
    const size = Math.max(17, Math.floor(NAME_SIZE * ratio)) + 'px';
    box.style.setProperty('--name-size', size);
    return size;
}

/** How many pixels short the widest line in `box` is, or 0 if everything fits. */
function shortfall(box) {
    let worst = 0;
    for (const line of box.querySelectorAll('.info > p')) {
        if (line.classList.contains('is-empty')) continue;
        worst = Math.max(worst, line.scrollWidth - line.clientWidth);
    }
    return worst > 1 ? worst : 0;
}

/** Final guarantee that nothing on the card ends in an ellipsis. Widens the
    panel to cover any shortfall, and only if it is already at its limit does it
    fall back to stepping the name down. Costs nothing when everything fits,
    which is the normal case. */
function ensureFits() {
    for (let pass = 0; pass < 3; pass++) {
        const short = shortfall(elCard);
        if (!short) return;
        const wider = Math.min(MAX_W, elCard.offsetWidth + short + 2);
        elInfo.style.width = (elInfo.getBoundingClientRect().width + short + 2) + 'px';
        if (wider <= elCard.offsetWidth) break;
        elCard.style.setProperty('--morph', '0ms');
        elCard.style.width = wider + 'px';
    }
    if (shortfall(elCard)) fitName(elCard);
}

/** How the panel should be laid out for this person, worked out offscreen at the
    final width so nothing has to be measured against a moving target. */
function measure(person, src) {
    elMeasure.querySelector('.info').style.removeProperty('width');
    paint(elMeasure, person, src);
    const nameSize = fitName(elMeasure);
    // offsetWidth is a whole number but the layout underneath is not, so a panel
    // built to the reported width can land a fraction of a pixel short and clip
    // the very text it was measured from. Two pixels covers the rounding.
    return {
        width: Math.min(MAX_W, elMeasure.offsetWidth + 2),
        infoWidth: Math.ceil(elMeasure.querySelector('.info').getBoundingClientRect().width) + 2,
        nameSize,
    };
}

/** Resolves once the browser source is on screen again, so an inactive scene
    doesn't silently burn through the roster. */
function whenVisible() {
    if (!document.hidden) return Promise.resolve();
    return new Promise((resolve) => {
        document.addEventListener('visibilitychange', function onChange() {
            if (document.hidden) return;
            document.removeEventListener('visibilitychange', onChange);
            resolve();
        });
    });
}

async function run() {
    people = await loadPeople();
    if (SHUFFLE) shuffle(people);

    // Every width on this card is measured, so the real font has to be in place
    // before any measuring happens — Vazirmatn is wider than the fallback, and a
    // panel measured in the fallback is built too narrow for the name it holds.
    //
    // Asking for fonts.ready alone is not enough: at this point nothing on the
    // page has any text in it, so the browser has not requested the font yet and
    // ready resolves immediately against an empty page. These load calls demand
    // the faces outright, with Persian sample text so the Arabic subset — the one
    // that actually renders these names — is the one that gets fetched.
    await Promise.all([
        document.fonts.load('700 23px Vazirmatn', 'آزمایش'),
        document.fonts.load('400 17px Vazirmatn', 'آزمایش'),
    ]).catch(() => {});
    await document.fonts.ready;

    // The opening card must not be held hostage by one portrait. On a slow link
    // a stalled image would leave the overlay blank for as long as it took; past
    // this point the first person is simply shown without a photo, and the panel
    // closes up around the name exactly as it does for anyone who has none.
    const first = nextPerson();
    const firstSrc = await Promise.race([prefetchImage(first), sleep(1200).then(() => null)]);
    const firstLayout = measure(first, firstSrc);

    // No transition on the opening width, or the name would be laid out against
    // a panel that is still growing into place.
    elCard.style.setProperty('--morph', '0ms');
    elCard.style.width = firstLayout.width + 'px';
    elInfo.style.width = firstLayout.infoWidth + 'px';
    paint(elCard, first, firstSrc, firstLayout.nameSize);
    ensureFits();
    await showPortrait(firstSrc);
    elCard.style.removeProperty('--morph');
    elCard.classList.add('is-lit', 'is-showing');

    while (people.length > 1) {
        // This runs unattended for hours, so one unreadable record must not be
        // able to end the stream's memorial. Anything unexpected costs that
        // person their turn and nothing more.
        try {
            await showNext();
        } catch {
            await sleep(1000);
        }
    }
}

async function showNext() {
    // Work the next person out while the current one is still on screen, so the
    // change never waits on the network or the decoder.
    const upcoming = nextPerson();
    const upcomingSrc = await prefetchImage(upcoming);
    const layout = measure(upcoming, upcomingSrc);

    await sleep(HOLD_MS);
    await whenVisible();

    if (MOTION === 'wipe') {
        // The panel closes to nothing, changes hands out of sight, and opens
        // again — the contents never fade, the moving edge does the work.
        elCard.style.setProperty('--morph', FADE_MS + 'ms');
        elCard.style.width = '0px';
        await sleep(FADE_MS);

        paint(elCard, upcoming, upcomingSrc, layout.nameSize);
        elInfo.style.width = layout.infoWidth + 'px';
        await showPortrait(upcomingSrc);
        elCard.style.width = layout.width + 'px';
        await sleep(FADE_MS);
        ensureFits();
        return;
    }

    // The panel resizes while the old details are fading, not in a gap of its
    // own afterwards — that gap was a visible pause with an empty pill in it.
    // By the time the next person is painted the panel is already their size.
    elCard.classList.remove('is-showing');
    elCard.style.setProperty('--morph', FADE_OUT_MS + 'ms');
    elCard.style.width = layout.width + 'px';
    await sleep(FADE_OUT_MS);

    paint(elCard, upcoming, upcomingSrc, layout.nameSize);
    elInfo.style.width = layout.infoWidth + 'px';
    ensureFits();
    await showPortrait(upcomingSrc);
    elCard.classList.add('is-showing');
    await sleep(FADE_MS);
}

run();
</script>
</body>
